<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Solar Economy - Authenticated</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f1117;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            text-align: center;
            padding: 2.5rem 3rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
        }
        .check {
            width: 48px; height: 48px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: rgba(74, 222, 128, 0.12);
            display: flex; align-items: center; justify-content: center;
        }
        .check svg { width: 24px; height: 24px; }
        h2 { font-size: 1.25rem; font-weight: 600; color: #4ade80; margin-bottom: 0.5rem; }
        p { font-size: 0.875rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">
            <svg viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
        </div>
        <h2>Authentication Successful</h2>
        <p>This window will close automatically.</p>
    </div>
    <script>
        setTimeout(() => window.close(), 1500);
    </script>
</body>
</html>
